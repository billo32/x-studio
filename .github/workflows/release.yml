# Release on a v* tag: signed and notarized universal X Studio, attached to a draft release.
#
# Repository secrets (Settings → Secrets and variables → Actions) — the same set as dos-gatos:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12 (base64 -i cert.p12 | pbcopy)
#   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
#   KEYCHAIN_PASSWORD           any random password for the temporary keychain
#   APPLE_API_ISSUER            Issuer ID from App Store Connect → Integrations
#   APPLE_API_KEY               Key ID
#   APPLE_API_KEY_P8            contents of AuthKey_<KeyID>.p8

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - run: npm ci

      - name: Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 3600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $RUNNER_TEMP/cert.p12 -k $KC -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          rm $RUNNER_TEMP/cert.p12
          ID=$(security find-identity -v -p codesigning $KC | grep -m1 '"Developer ID Application' | sed -E 's/.*"(.*)"/\1/')
          test -n "$ID" || { echo "the .p12 has no Developer ID Application identity"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$ID" >> $GITHUB_ENV

      - name: App Store Connect key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        # runner.temp is not available in job-level env, so the path is set here.
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        run: ./scripts/build-signed.sh --target universal-apple-darwin

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "X Studio $GITHUB_REF_NAME"
