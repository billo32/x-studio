[package]
name = "x4-epub"
description = "EPUB clean-up for store downloads (metadata, cover page, XHTML), from yaebook"
version.workspace = true
# 2024: the code vendored from yaebook uses let-chains.
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
time = { version = "0.3", default-features = false, features = ["formatting", "std"] }
xmltree = "0.11"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
serde_json = "1"
